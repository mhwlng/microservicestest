name: microservicestest

services:
  micro-services-db:
    env_file: ".env"
    image: postgres:18
    container_name: micro-services-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
#    ports:
#      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  task-service:
    build: ./task-service
    pull_policy: build
    image: task-service
    container_name: task-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://micro-services-db:5432/db
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: prod
#   ports:
#     - "4000:4000" 
    restart: unless-stopped
    depends_on:
      micro-services-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://task-service:4000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - internal

  auth-service:
    build: ./auth-service
    pull_policy: build
    image: auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://micro-services-db:5432/db
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}   
      SPRING_PROFILES_ACTIVE: prod
#   ports:
#     - "4005:4005" 
    restart: unless-stopped
    depends_on:
      micro-services-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://auth-service:4005/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api-gateway:
    build: ./api-gateway
    pull_policy: build
    image: api-gateway
    container_name: api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005/
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "4004:4004" 
    restart: unless-stopped
    depends_on:
      micro-services-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://api-gateway:4004/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db-data: