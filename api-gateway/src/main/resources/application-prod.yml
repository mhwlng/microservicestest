server:
  port: 4004 # Gateway listens on port 4004

auth:
  service:
    url: http://auth-service:4005/

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tasks-route
              uri: http://task-service:4000
              predicates:
                - Path=/api/tasks/**
              filters:
                - JwtValidation
                - RewritePath=/api/tasks,/api/v1/tasks

            - id: auth-service-route
              uri: http://auth-service:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
