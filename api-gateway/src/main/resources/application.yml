server:
  port: 4004 # Gateway listens on port 4004

auth:
  service:
   url: http://127.0.0.1:4005/

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

#actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  # health:
  #   defaults:
  #     enabled: false

spring:
  profiles:
    active: dev
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tasks-route
              uri: http://127.0.0.1:4000
              predicates:
                - Path=/api/tasks/**
              filters:
                - JwtValidation
                - RewritePath=/api/tasks,/api/v1/tasks

            - id: auth-service-route
              uri: http://127.0.0.1:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: api-docs-tasks-route
              uri: http://127.0.0.1:4000
              predicates:
                - Path=/api-docs/tasks
              filters:
                - RewritePath=/api-docs/tasks,/v3/api-docs

            - id: api-docs-auth-route
              uri: http://127.0.0.1:4005
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs
